disableStartupPopups: true
gui:
  showRandomTip: true
  nerdFontsVersion: "3"
  mouseEvents: false
git:
  autoFetch: false
  diffRenderers:
    - command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - command: difft --color=always
      type: extDiff
